<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEYNG</title>
    <meta name="description" content="Portfolio of HEYNG — tools, infra, and dev tooling for Linux." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta property="og:title" content="HEYNG" />
    <meta property="og:description" content="Portfolio of HEYNG — tools, infra, and dev tooling for Linux." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d0c0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main id="home">
        <section class="hero fade-in">
          <h1>HEYNG</h1>
          <p class="intro">
            I build simple things, like clean interfaces and practical tools.
          </p>
          <p class="hero-links">
            <a href="https://github.com/h3yng" aria-label="GitHub">
              <svg class="icon" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
              </svg>
            </a>
          </p>
        </section>

        <section class="work fade-in" id="work">
          <ul class="project-list" id="projects-container"></ul>
          <div id="projects-error" class="error-msg" hidden>Failed to load projects.</div>
        </section>
      </main>

      <footer class="site-footer fade-in">
      </footer>
    </div>

    <script>
      async function loadProjects() {
        try {
          const response = await fetch('data.json');
          if (!response.ok) throw new Error(response.statusText);
          const data = await response.json();
          const container = document.getElementById('projects-container');

          data.projects.forEach(project => {
            const li = document.createElement('li');
            li.className = 'project';
            li.id = project.id;

            const title = document.createElement('a');
            title.href = project.href || `#${project.id}`;
            title.textContent = project.title;
            title.className = 'project-title';

            const desc = document.createElement('span');
            desc.className = 'project-desc';
            desc.textContent = project.description;

            li.appendChild(title);
            li.appendChild(desc);
            container.appendChild(li);
          });
        } catch (error) {
          console.error('Error loading projects:', error);
          document.getElementById('projects-error').hidden = false;
        }
      }

      loadProjects();
    </script>
  </body>
</html>
